name: Construire PRO PRONOSTIC DZ

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extraire le projet
        run: unzip -o PRO_PRONOSTIC_DZ_V2_Android_GitHub.zip

      - name: Compiler APK
        working-directory: PRO_PRONOSTIC_DZ_V2
        run: gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PRO-PRONOSTIC-DZ-APK
          path: PRO_PRONOSTIC_DZ_V2/app/build/outputs/apk/debug/app-debug.apk
